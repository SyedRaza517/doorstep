# Render blueprint for the Doorstep API.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo.
#
# The disk matters. Render wipes the filesystem on every deploy and restart,
# so without it the SQLite database — accounts, listings, claims — is gone
# each time the service redeploys or wakes from sleep. The disk keeps it.
# A disk requires a paid instance type; on the free tier, drop the `disk`
# block and treat the deployment as a demo that re-seeds itself on boot.
services:
  - type: web
    name: doorstep-api
    runtime: node
    plan: starter
    region: frankfurt # closest to a London launch
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: doorstep-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      # keeps the database on the persistent disk rather than the container
      - key: DOORSTEP_DB
        value: /var/data/doorstep.db
      # optional: switches on drafting a listing from its photo
      - key: ANTHROPIC_API_KEY
        sync: false
