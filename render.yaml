# Render blueprint for the Doorstep API.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo.
#
# There is deliberately no Render Postgres and no disk here: the database
# lives in Supabase, so this service is stateless and can restart, sleep or
# scale without losing anything. Set DATABASE_URL to the Supabase connection
# string — use the Session pooler (port 5432) URI, which supports the
# transactions and row locks the claim flow relies on.
services:
  - type: web
    name: doorstep-api
    runtime: node
    plan: free
    region: frankfurt # closest to a London launch
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase → Project Settings → Database → Connection string → URI
      - key: DATABASE_URL
        sync: false
      # optional: switches on drafting a listing from its photo
      - key: ANTHROPIC_API_KEY
        sync: false
