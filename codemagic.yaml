# =============================================================================
#  Codemagic CI/CD configuration for Doorstep (React + Vite + Capacitor 8)
# =============================================================================
#
#  WHAT THIS FILE IS
#  Codemagic reads this file from the repo root and shows one entry per
#  "workflow" below. You pick a workflow in the Codemagic UI and press
#  "Start new build". Nothing here runs automatically unless a `triggering:`
#  block says so - and deliberately, none of them do (see ios-release).
#
#  WHICH WORKFLOW TO RUN FIRST
#    1. `ios-unsigned`  <- START HERE. Needs ZERO credentials. No Apple
#       Developer account, no certificates, no API keys. It proves the whole
#       pipeline (npm install -> Vite build -> Capacitor sync -> Xcode compile)
#       works. The output is an unsigned .app that cannot be installed on a
#       real device, but a green build means everything except signing is fine.
#    2. `ios-release`   <- Run this only AFTER you have a paid Apple Developer
#       account and have configured the credentials listed below. It produces
#       a signed .ipa and uploads it to TestFlight.
#    3. `android-release` <- Optional. Only needed when you want to ship to
#       Google Play. Requires you to create a signing keystore yourself.
#
#  WHAT MUST BE CONFIGURED BEFORE `ios-release` WILL WORK
#  Almost nothing, because the App Store Connect API key already exists in
#  this Codemagic team as the integration named `Codemagic-Admin` - the same
#  one ClassAura builds with. An App Store Connect key is account-wide, not
#  per-app, so one key covers every app in the Apple account.
#
#  There are NO environment variables to set for iOS. Signing is handled by
#  the `ios_signing:` block, which is Codemagic-managed: it generates the
#  certificate keypair, keeps the private key with the team, and installs
#  both certificate and profile into the build keychain before any script
#  runs. See the long comment on that block for why the scripted alternative,
#  `fetch-signing-files --create`, cannot work at all.
#
#  What you DO need, once, by hand:
#    - the App ID `uk.co.doorstep.app` registered in the Apple developer portal
#    - the app record created in App Store Connect, which yields the numeric
#      Apple ID set as APP_STORE_APPLE_ID below
#  Both are done for Doorstep.
#
#  The API key behind the integration must have the App Manager role. A
#  Developer-role key can read signing assets but cannot create them.
#
#  IMPORTANT: THIS IOS PROJECT USES SWIFT PACKAGE MANAGER, NOT COCOAPODS
#  Capacitor 8 generates a local Swift package at ios/App/CapApp-SPM. There is
#  NO Podfile and NO App.xcworkspace in this repo. Every iOS build below
#  therefore targets the *project* (`ios/App/App.xcodeproj`), never a
#  workspace, and there is deliberately no `cocoapods install` step - Xcode
#  resolves the Swift packages itself on first build. Codemagic tutorials
#  usually say `--workspace ios/App/App.xcworkspace`; that is wrong for this
#  repo and will fail.
#
#  WHY EVERY WORKFLOW REBUILDS THE WEB APP
#  ios/.gitignore excludes `App/App/public` and `App/App/capacitor.config.json`,
#  so the compiled web assets are NOT stored in git. A workflow that skipped
#  `npm run build` + `npx cap sync` would ship an app that launches to a blank
#  white screen. The API URL comes from the committed `.env.production` file,
#  which Vite reads automatically - do not duplicate it as an env var here.
# =============================================================================

workflows:

  # ===========================================================================
  # 1. ios-unsigned - run this first; works with no credentials at all
  # ===========================================================================
  ios-unsigned:
    name: iOS - unsigned test build (no Apple account needed)
    # Hard stop (minutes) so a hung build cannot eat your whole monthly budget.
    max_build_duration: 60
    # Apple Silicon macOS VM. iOS code can only be compiled on macOS.
    instance_type: mac_mini_m2
    environment:
      # Capacitor 8's CLI declares engines: { node: ">=22.0.0" } and refuses to
      # run on anything older - `npx cap sync` aborts with "The Capacitor CLI
      # requires NodeJS >=22.0.0". npm and Vite run fine on 20, so that failure
      # lands on the cap sync step rather than at install time.
      node: 22
      # "latest" = newest stable Xcode available on the Codemagic image.
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          # `npm ci` (not `npm install`) installs the exact versions pinned in
          # package-lock.json, so CI builds are reproducible.
          npm ci

      - name: Build the web app with Vite
        script: |
          # Produces ./dist, which capacitor.config.json declares as webDir.
          # Vite automatically loads .env.production here (VITE_API_URL).
          npm run build

      - name: Copy web assets into the iOS project
        script: |
          # `cap sync` copies ./dist into ios/App/App/public and regenerates
          # the native config. Without this the built app would be empty,
          # because those files are gitignored.
          npx cap sync ios

      - name: Build unsigned .app with xcodebuild
        script: |
          # We call xcodebuild directly instead of Codemagic's
          # `xcode-project build-ipa` because an .ipa cannot be produced
          # without a signing certificate. The CODE_SIGN* overrides switch
          # signing off entirely, which is what lets this run with no Apple
          # account. -project (not -workspace) because this app uses SPM.
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -resultBundlePath build/App.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Zip the .app for download
        script: |
          # An .app is a folder, not a file. Zipping it makes it a single,
          # reliably downloadable artifact from the Codemagic build page.
          # `-y` keeps symlinks intact, which macOS bundles rely on.
          cd build/Build/Products/Release-iphoneos
          zip -r -y "$CM_BUILD_DIR/build/App-unsigned.zip" App.app
    artifacts:
      # Files matching these patterns are attached to the finished build.
      - build/App-unsigned.zip
      # The .xcresult bundle holds the full logs and errors - the first place
      # to look when a build goes red, without having to re-run it.
      - build/App.xcresult
    publishing:
      # No signing or store credentials here on purpose: email only.
      email:
        recipients:
          - syedmuhammadr517@gmail.com

  # ===========================================================================
  # 2. ios-release - signed build, uploaded to TestFlight
  #    Signing is Codemagic-managed via the `Codemagic-Admin` integration.
  #    There is nothing to set up in the UI for this workflow.
  # ===========================================================================
  ios-release:
    name: iOS - signed release to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    # --- Automatic triggering is intentionally DISABLED ---------------------
    # Uncomment only when you are happy for EVERY push to main to consume
    # build minutes and send a new build to TestFlight.
    #
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    #       source: true
    #   cancel_previous_builds: true
    # ------------------------------------------------------------------------
    integrations:
      # The App Store Connect API key registered under Codemagic -> Teams ->
      # Integrations. This is the same key ClassAura builds with: an App Store
      # Connect key is account-wide, not per-app, so one key covers every app
      # in the Apple account. The name must match the label in that UI exactly.
      app_store_connect: Codemagic-Admin
    environment:
      # Codemagic-managed signing. This deliberately replaces a hand-rolled
      # `app-store-connect fetch-signing-files --create`, which cannot work:
      #
      #   Cannot save Signing Certificates without certificate private key
      #   Did not find matching provisioning profiles for code signing!
      #    - Provisioning Profiles: []
      #
      # Apple never releases a certificate's private key - it only ever exists
      # on the machine that generated the signing request. So the CLI could
      # create a certificate at Apple, but had no key to pair it with,
      # discarded it, and then had nothing to match a profile against. Every
      # downstream value came out blank and the archive failed with the
      # misleading "App requires a provisioning profile".
      #
      # With this block Codemagic generates the keypair itself, keeps it with
      # the team, and installs the certificate and profile into the build
      # keychain before any script runs - so the private key survives between
      # builds and no new certificate is burned each time (Apple caps
      # distribution certificates at three).
      ios_signing:
        distribution_type: app_store
        # Must equal PRODUCT_BUNDLE_IDENTIFIER in the Xcode project and the App
        # ID registered with Apple. Codemagic resolves this before any script
        # runs, to fetch the signing assets, so it cannot be derived at runtime.
        bundle_identifier: uk.co.doorstep.app
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "uk.co.doorstep.app"
        # Numeric Apple ID of the app record in App Store Connect. It is both
        # the upload target AND what the build-number step reads to find the
        # latest TestFlight build, so a wrong value uploads to another listing
        # and numbers the build from that listing's history.
        APP_STORE_APPLE_ID: 6814433152
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build the web app with Vite
        script: |
          # Produces ./dist, which capacitor.config.json declares as webDir.
          # Unlike ClassAura, .env.production IS committed in this repo, so
          # VITE_API_URL reaches the build without being set here. Setting it
          # in both places would just create somewhere for them to disagree.
          npm run build

      - name: Copy web assets into the iOS project
        script: |
          # The web bundle is gitignored (ios/.gitignore excludes App/App/public),
          # so without this the app ships empty and opens to a white screen.
          npx cap sync ios

      - name: Apply the signing profile to the Xcode project
        script: |
          set -e
          # Codemagic has already installed the certificate and profile into the
          # build keychain (see ios_signing above). This writes the profile into
          # the project so the archive can find it. --project is explicit so it
          # cannot search the wrong place and patch nothing.
          xcode-project use-profiles --project "ios/App/App.xcodeproj" --verbose

          echo "=== signing settings written into the project ==="
          grep -oE "(DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY) = [^;]*" ios/App/App.xcodeproj/project.pbxproj | sort -u

          # Stop here with the reason rather than later with a generic exit 65.
          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER" ios/App/App.xcodeproj/project.pbxproj; then
            echo ""
            echo "FATAL: no provisioning profile was written into the Xcode project."
            echo "Codemagic did not install one. Check that the App Store Connect"
            echo "integration 'Codemagic-Admin' is attached to this workflow and that"
            echo "the bundle id $BUNDLE_ID is registered in the Apple Developer portal."
            exit 1
          fi

      - name: Set build number from latest TestFlight
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))

      - name: Build .ipa
        script: |
          # --project, NOT --workspace: this app uses Swift Package Manager and
          # has no .xcworkspace. Passing --workspace is the commonest way this
          # build breaks.
          cd ios/App
          xcode-project build-ipa --project "App.xcodeproj" --scheme "$XCODE_SCHEME"
    artifacts:
      # Note the ios/App prefix: build-ipa runs after `cd ios/App`, so its
      # output lands there rather than at the repository root.
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/ios/xcarchive/*.dSYM
    publishing:
      app_store_connect:
        # Reuse the API key from the integration above.
        auth: integration
        # Land in TestFlight for internal testers.
        submit_to_testflight: true
        # Left off deliberately: turning this on starts public App Store review
        # automatically on every build.
        submit_to_app_store: false
      email:
        recipients:
          - syedmuhammadr517@gmail.com

  # ===========================================================================
  # 3. android-release - OPTIONAL
  #    Only needed for Google Play. Skip it entirely if you are shipping iOS
  #    first. It will fail until you create a keystore and add the
  #    `keystore_credentials` variable group.
  # ===========================================================================
  android-release:
    name: Android - signed release (OPTIONAL)
    max_build_duration: 60
    # Android can also build on Linux (`linux_x2`, cheaper). Kept on the same
    # macOS image so there is only one machine type to reason about.
    instance_type: mac_mini_m2
    environment:
      groups:
        # Create this group in the Codemagic UI with four variables:
        #   CM_KEYSTORE           - your .jks file, base64-encoded, "Secure"
        #                           (on macOS/Linux: base64 -i my.jks | pbcopy)
        #   CM_KEYSTORE_PASSWORD  - "Secure"
        #   CM_KEY_ALIAS          - the alias you chose when running keytool
        #   CM_KEY_PASSWORD       - "Secure"
        # The keystore is deliberately NOT in this repo (.gitignore refuses
        # *.jks): anyone holding it can publish updates as you, and losing it
        # means you can never update the Play Store listing again.
        - keystore_credentials
      # Node 22+: required by the Capacitor 8 CLI (see ios-unsigned above).
      node: 22
      # Capacitor 8's Android Gradle Plugin requires JDK 21.
      java: 21
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build the web app with Vite
        script: |
          npm run build

      - name: Copy web assets into the Android project
        script: |
          npx cap sync android

      - name: Decode the keystore and write keystore.properties
        script: |
          # Environment variables cannot hold binary, so the keystore travels
          # as base64 and is decoded back into a real file on the build
          # machine. The VM is destroyed afterwards, so nothing leaks.
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/keystore.jks"
          # android/app/build.gradle must read this file for signing to take
          # effect. If it does not yet, the build still succeeds but produces
          # an UNSIGNED .aab/.apk that Google Play will reject on upload.
          cat > "$CM_BUILD_DIR/android/keystore.properties" <<EOF
          storeFile=$CM_BUILD_DIR/android/keystore.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Build release APK and AAB
        script: |
          cd android
          # assembleRelease -> .apk (direct install / sideloading / testing)
          # bundleRelease   -> .aab (the format Google Play requires)
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      # Gradle's obfuscation map, needed to read Android crash reports.
      - android/app/build/outputs/mapping/**/mapping.txt
    publishing:
      # NOTE: there is intentionally NO `google_play:` block. Publishing to the
      # Play Store stays manual - download the .aab from this build and upload
      # it yourself until you are confident in the pipeline.
      email:
        recipients:
          - syedmuhammadr517@gmail.com
